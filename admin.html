<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beauty Shop - Panel de Administración</title>
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- PDF.js para renderizar páginas PDF en el navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <header class="header">
    <div class="logo">BEAUTY SHOP ADMIN</div>
    <a href="index.html" class="btn-back">← Ir a la Tienda</a>
  </header>

  <main class="container">
    <section class="admin-card">
      <h2>🚀 Cargar Nuevo Catálogo</h2>
      <p>Sube el archivo PDF de la marca. El sistema lo convertirá a formato **WebP**, lo alojará en **ImgBB** y la **IA de Gemini** extraerá precios, códigos y fichas técnicas automáticamente.</p>

      <form id="formUploadCatalog">
        <label for="nombreMarca">Nombre de la Marca / Catálogo:</label>
        <input type="text" id="nombreMarca" placeholder="Ej: Yanbal Campaña 5" required>

        <label for="filePdf">Selecciona el PDF del Catálogo:</label>
        <input type="file" id="filePdf" accept="application/pdf" required>

        <button type="submit" id="btnProcesar" class="btn-main">
          ✨ Procesar Catálogo con IA
        </button>
      </form>

      <!-- Barra de progreso / Estado -->
      <div id="statusContainer" class="status-container" style="display: none;">
        <div id="statusMessage">Iniciando procesamiento...</div>
        <progress id="progressBar" value="0" max="100"></progress>
      </div>
    </section>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
