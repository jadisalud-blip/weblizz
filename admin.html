<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Beauty Shop</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h1 { color: #ff007f; }
    .btn-logout { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .tab-btn { background: transparent; color: #94a3b8; border: none; padding: 10px 20px; cursor: pointer; font-size: 1rem; border-radius: 6px; }
    .tab-btn.active { background: #ff007f; color: white; }
    .panel { display: none; background: #1e293b; padding: 20px; border-radius: 12px; }
    .panel.active { display: block; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    @media (max-width:600px) { .form-grid { grid-template-columns: 1fr; } }
    label { font-size: 0.85rem; color: #94a3b8; font-weight: bold; display: block; margin-bottom: 5px; }
    input, select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: white; }
    button { padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #status-console { background: #000; color: #4ade80; padding: 15px; border-radius: 6px; font-family: monospace; font-size: 0.9rem; margin-top: 20px; border-left: 4px solid #22c55e; min-height: 100px; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
    .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px; }
    @media (max-width:768px) { .preview-grid { grid-template-columns: 1fr; } }
    .card-box { border: 1px solid #334155; border-radius: 8px; padding: 15px; background: #0f172a; }
    .card-box h3 { margin-top: 0; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .producto-item { background: #1e293b; border-left: 4px solid #38bdf8; border-radius: 6px; padding: 10px; margin-bottom: 8px; }
    .codigo-badge { background: #ff007f; color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>👑 Panel de Administración</h1>
    <button class="btn-logout" id="btnLogout">Cerrar Sesión</button>
  </div>
  <div class="tabs">
    <button class="tab-btn active" id="tabSubir">📤 Subir Catálogo</button>
    <button class="tab-btn" id="tabPedidos">📦 Pedidos</button>
  </div>
  <div class="panel active" id="panelSubir">
    <div class="form-grid">
      <div><label>Marca / Catálogo:</label><input type="text" id="catalogName" placeholder="Ej: Yanbal - Campaña 8"></div>
      <div><label>Archivo PDF:</label><input type="file" id="pdfInput" accept="application/pdf"></div>
    </div>
    <button id="btnProcesar">⚙️ Procesar Catálogo</button>
    <div id="status-console">> Esperando archivo...</div>
    <div class="preview-grid">
      <div class="card-box"><h3>🖼️ Vista Previa</h3><div id="imageContainer" style="text-align:center;color:#64748b;padding:20px;">Vista previa al procesar</div></div>
      <div class="card-box"><h3>📋 Productos Detectados</h3><div id="fichasContainer" style="max-height:400px;overflow-y:auto;"><p style="color:#64748b;">Los productos aparecerán aquí...</p></div></div>
    </div>
  </div>
  <div class="panel" id="panelPedidos">
    <h3>📦 Pedidos Recibidos</h3>
    <div id="pedidosContainer"><p style="color:#64748b;">Cargando pedidos...</p></div>
  </div>
</div>
<script type="module" src="./js/admin.js"></script>
<script>
  document.getElementById('btnLogout').addEventListener('click', async () => {
    const { cerrarSesion } = await import('./js/auth.js');
    await cerrarSesion();
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
