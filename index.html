<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Interactivo</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f4f4f9; color: #333; }
    header { background: #111; color: #fff; padding: 15px; text-align: center; font-weight: bold; }
    .catalog-container { position: relative; max-width: 600px; margin: 0 auto; min-height: 80vh; background: #fff; }
    .page-image { width: 100%; display: block; }
    .checkbox-overlay { position: absolute; cursor: pointer; border: 2px solid #007bff; background: rgba(0, 123, 255, 0.2); border-radius: 4px; }
  </style>
</head>
<body>

  <header>Catálogo Interactivo</header>

  <main class="catalog-container" id="catalog-app">
    <p style="text-align: center; padding: 40px;">Cargando catálogo...</p>
  </main>

  <script type="module" src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker Registrado'))
        .catch(err => console.error('Error SW:', err));
    }
  </script>
</body>
</html>
