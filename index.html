<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beauty Shop - Catálogos Virtuales</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="header">
    <div class="logo">BEAUTY SHOP</div>
    <a href="admin.html" class="btn-back">Acceso Admin 🔒</a>
  </header>

  <main class="container">
    <h2>✨ Catálogos Disponibles</h2>
    <p style="color: var(--text-muted); margin-top: 0.3rem;">Selecciona una marca para ver las ofertas interactivas.</p>

    <div id="catalogGrid" class="catalog-grid">
      <p style="color: var(--text-muted);">Cargando catálogos...</p>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
