<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beauty Shop - Visor de Catálogo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="header">
    <a href="index.html" class="btn-back">← Volver</a>
    <div id="catalogTitle" class="logo">Catálogo</div>
  </header>

  <main class="container">
    <div class="page-navigation" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <button id="btnPrevPage" class="btn-back">◀ Anterior</button>
      <span id="pageIndicator" style="color: var(--text-muted);">Página 1</span>
      <button id="btnNextPage" class="btn-back">Siguiente ▶</button>
    </div>

    <!-- Contenedor con la imagen WebP y checkboxes superpuestos -->
    <div id="pageViewerContainer" class="page-viewer-container">
      <img id="catalogPageImage" class="page-image" src="" alt="Cargando página...">
      <div id="hotspotsOverlay"></div>
    </div>
  </main>

  <!-- Barra inferior flotante de pedido -->
  <div class="order-bar">
    <div>
      <span style="font-size: 0.85rem; color: var(--text-muted);">Total Seleccionado:</span>
      <div id="orderTotal" style="font-size: 1.3rem; font-weight: bold; color: var(--accent-color);">$0.00</div>
    </div>
    <button id="btnSendWhatsapp" class="btn-whatsapp" style="width: auto; padding: 0.8rem 1.5rem;">
      📲 Pedir por WhatsApp (<span id="itemCount">0</span>)
    </button>
  </div>

  <script type="module" src="js/catalogo.js"></script>
</body>
</html>
