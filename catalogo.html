<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beauty Shop - Visor de Catálogo</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: #000000; color: #f8fafc; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
    header { padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; background: #050505; position: sticky; top: 0; z-index: 50; }
    .btn-back { background: transparent; color: #ff007f; border: 1px solid #ff007f; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    .catalog-title { font-size: 1.2rem; font-weight: bold; color: #fff; }
    .catalog-container { max-width: 900px; margin: 20px auto; padding: 0 15px; width: 100%; flex: 1; }
    .page-viewer { position: relative; width: 100%; background: #111; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
    .page-viewer img { width: 100%; display: block; height: auto; }
    .product-hotspot { position: absolute; border: 2px dashed #ff007f; background: rgba(255,0,127,0.15); border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .product-hotspot:hover { background: rgba(255,0,127,0.35); border-style: solid; }
    .product-hotspot.selected { background: rgba(0,255,128,0.3); border-color: #00ff80; }
    .page-controls { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; }
    .btn-nav { background: #111; color: #fff; border: 1px solid #444; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }
    .page-info { color: #888; }
    .products-list { background: #0a0a0a; border: 1px solid #222; border-radius: 12px; padding: 20px; margin-top: 20px; max-height: 400px; overflow-y: auto; }
    .products-list h3 { margin-top: 0; color: #ff007f; }
    .product-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1a1a1a; }
    .product-item:last-child { border-bottom: none; }
    .product-info { flex: 1; margin-right: 15px; }
    .product-name { font-weight: bold; color: #eee; }
    .product-price { color: #ff007f; font-weight: bold; }
    .btn-cantidad { background: #334155; color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; font-weight: bold; }
    .btn-cantidad:hover { background: #475569; }
    .cantidad-num { font-weight: bold; font-size: 1.1rem; min-width: 30px; text-align: center; display: inline-block; }
    .cart-bar { position: sticky; bottom: 0; background: #0a0a0a; border-top: 1px solid #222; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; z-index: 50; flex-wrap: wrap; gap: 10px; }
    .cart-summary { font-size: 1rem; color: #fff; }
    .cart-summary span { color: #00ff80; font-weight: bold; }
    .btn-confirm { background: #ff007f; color: #fff; border: none; padding: 12px 24px; border-radius: 25px; font-weight: bold; cursor: pointer; }
    .btn-confirm:disabled { background: #475569; cursor: not-allowed; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 200; }
    .modal-content { background: #0a0a0a; border: 2px solid #ff007f; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; }
    .modal-content h2 { color: #ff007f; margin-top: 0; }
    .modal-content input { width: 100%; padding: 12px; background: #111; border: 1px solid #444; border-radius: 6px; color: white; margin: 8px 0; }
    .btn-registro { width: 100%; margin-top: 15px; background: #ff007f; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
<div class="modal" id="modalRegistro">
  <div class="modal-content">
    <h2>✨ Regístrate para comprar</h2>
    <input type="text" id="regNombre" placeholder="Tu nombre completo">
    <input type="tel" id="regCelular" placeholder="Número de celular">
    <button class="btn-registro" id="btnRegistro">Continuar</button>
  </div>
</div>
<header>
  <button class="btn-back" onclick="window.location.href='index.html'">← Volver</button>
  <div class="catalog-title" id="catalogTitle">Cargando catálogo...</div>
  <div id="userBadge" style="color:#ff007f;font-size:0.8rem;">Invitado</div>
</header>
<div class="catalog-container">
  <div class="page-controls">
    <button class="btn-nav" id="btnPrevPage">← Anterior</button>
    <span class="page-info" id="pageIndicator">Página 1 de 1</span>
    <button class="btn-nav" id="btnNextPage">Siguiente →</button>
  </div>
  <div class="page-viewer" id="pageViewer">
    <img id="catalogPageImg" src="" alt="Página del Catálogo">
    <div id="hotspotsContainer"></div>
  </div>
  <div class="products-list">
    <h3>🛒 Productos en esta página</h3>
    <div id="productsContainer"><p style="color:#666;">Cargando productos...</p></div>
  </div>
</div>
<div class="cart-bar">
  <div class="cart-summary">Seleccionados: <strong id="cartCount">0</strong> | Total: <span id="cartTotal">$0.00</span></div>
  <button class="btn-confirm" id="btnConfirmOrder" disabled>✅ Confirmar Pedido</button>
</div>
<script type="module" src="./js/catalogo.js"></script>
<script>
  document.getElementById('btnRegistro').addEventListener('click', async () => {
    const nombre = document.getElementById('regNombre').value.trim();
    const celular = document.getElementById('regCelular').value.trim();
    if (!nombre || !celular) { alert('Completa todos los campos.'); return; }
    const { guardarUsuarioCelular } = await import('./js/auth.js');
    const result = await guardarUsuarioCelular(nombre, celular);
    if (result.success) {
      document.getElementById('modalRegistro').style.display = 'none';
      document.getElementById('userBadge').innerHTML = `👤 ${nombre}`;
      location.reload();
    } else alert('Error: ' + result.error);
  });
</script>
</body>
</html>
