<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Procesador de Catálogos PDF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
    .container { max-width: 1000px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { color: #38bdf8; font-size: 1.6rem; margin-top: 0; border-bottom: 2px solid #334155; padding-bottom: 10px; }
    
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 20px; }
    @media (min-width: 600px) { .form-grid { grid-template-columns: 1fr 1fr; } }
    
    label { font-size: 0.85rem; color: #94a3b8; font-weight: bold; display: block; margin-bottom: 5px; }
    input, select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: white; }
    
    button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #475569; cursor: not-allowed; }
    
    #status-console { background: #000; color: #4ade80; padding: 15px; border-radius: 6px; font-family: monospace; font-size: 0.9rem; margin-top: 20px; border-left: 4px solid #22c55e; min-height: 50px; }
    
    .preview-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 25px; }
    @media (min-width: 768px) { .preview-grid { grid-template-columns: 1fr 1fr; } }
    
    .card-box { border: 1px solid #334155; border-radius: 8px; padding: 15px; background: #0f172a; }
    .card-box h3 { margin-top: 0; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 8px; font-size: 1.1rem; }
    img { max-width: 100%; height: auto; border-radius: 6px; border: 1px solid #475569; }
    
    .producto-item { background: #1e293b; border: 1px solid #475569; border-left: 4px solid #38bdf8; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
    .prod-title { font-weight: bold; color: #f8fafc; font-size: 1rem; }
    .prod-detail { color: #cbd5e1; font-size: 0.85rem; margin: 4px 0; }
    .prod-code { background: #312e81; color: #c7d2fe; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }
    .prod-price { color: #4ade80; font-weight: bold; font-size: 1.1rem; }
    .prod-box { font-family: monospace; font-size: 0.75rem; color: #94a3b8; background: #0f172a; padding: 4px; border-radius: 4px; margin-top: 6px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🚀 Procesador Automático de Catálogos PDF</h1>

    <div class="form-grid">
      <div>
        <label>Marca / Catálogo:</label>
        <input type="text" id="catalogName" placeholder="Ej: Yanbal - Campaña 8">
      </div>
      <div>
        <label>Seleccionar Archivo PDF:</label>
        <input type="file" id="pdfInput" accept="application/pdf">
      </div>
    </div>

    <button id="btnProcesar">⚙️ Iniciar Carga y Procesamiento Secuencial</button>

    <div id="status-console">> Esperando selección de archivo PDF...</div>

    <div class="preview-grid">
      <div class="card-box">
        <h3>🖼️ Imagen Cargada (Página Actual)</h3>
        <div id="imageContainer" style="text-align: center; color: #64748b; padding: 40px 0;">
          Vista previa disponible al procesar
        </div>
      </div>

      <div class="card-box">
        <h3>📋 Fichas Técnicas Extraídas</h3>
        <div id="fichasContainer">
          <p style="color: #64748b;">Los resultados de la IA aparecerán aquí conforme avance el lote...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    function logStatus(msg) {
      document.getElementById('status-console').innerText = `> ${msg}`;
    }

    document.getElementById('btnProcesar').addEventListener('click', async () => {
      const fileInput = document.getElementById('pdfInput');
      const catalogName = document.getElementById('catalogName').value.trim();

      if (!fileInput.files[0]) {
        alert('Por favor selecciona un archivo PDF.');
        return;
      }
      if (!catalogName) {
        alert('Por favor ingresa un nombre para el catálogo/marca.');
        return;
      }

      const btn = document.getElementById('btnProcesar');
      btn.disabled = true;

      try {
        const file = fileInput.files[0];
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const totalPages = pdf.numPages;

        logStatus(`PDF cargado correctamente. Total de páginas: ${totalPages}. Iniciando secuencia...`);

        for (let i = 1; i <= totalPages; i++) {
          const numPagina = i === 1 ? "Portada / Pág 1" : `Página ${i}`;
          logStatus(`[${i}/${totalPages}] Procesando ${numPagina}: Renderizando lienzo gráfico...`);

          const page = await pdf.getPage(i);
          const viewport = page.getViewport({ scale: 1.5 });
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({ canvasContext: context, viewport: viewport }).promise;

          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          const base64Image = dataUrl.split(',')[1];

          // 1. Mostrar vista previa de la página actual
          document.getElementById('imageContainer').innerHTML = `<img src="${dataUrl}" alt="Página ${i}">`;

          // 2. Subida a ImgBB para obtener URL corta
          logStatus(`[${i}/${totalPages}] Subiendo imagen de ${numPagina} a servidor de imágenes (ImgBB)...`);
          let imgbbUrl = "";
          try {
            const formData = new FormData();
            formData.append('image', base64Image);
            const imgbbRes = await fetch('https://api.imgbb.com/1/upload?key=6d25783563b715201103f8e658055628', {
              method: 'POST',
              body: formData
            });
            const imgbbData = await imgbbRes.json();
            if (imgbbData.success) {
              imgbbUrl = imgbbData.data.url;
            }
          } catch (e) {
            console.warn("Error subiendo a ImgBB:", e);
          }

          // 3. Análisis de Gemini AI
          logStatus(`[${i}/${totalPages}] Analizando contenido de ${numPagina} con Gemini AI...`);
          const prompt = `Analiza esta página de catálogo comercial. Extrae los productos con sus detalles exactos.
Devuelve ÚNICAMENTE un JSON válido:
{
  "productos": [
    {
      "nombre": "Nombre del producto",
      "codigo": "Código o ID",
      "precio": 19.99,
      "ficha_tecnica": "Detalles, tono, uso, características",
      "box_2d": [ymin, xmin, ymax, xmax]
    }
  ]
}`;

          const geminiRes = await fetch('/api/gemini', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ base64Image, prompt })
          });

          const geminiData = await geminiRes.json();
          const textRaw = geminiData?.candidates?.[0]?.content?.parts?.[0]?.text || "";
          const cleanJsonText = textRaw.replace(/```json/gi, '').replace(/```/g, '').trim();

          let parsed = {};
          try { parsed = JSON.parse(cleanJsonText); } catch (err) {}
          const productos = parsed.productos || (Array.isArray(parsed) ? parsed : []);

          // 4. Imprimir fichas en pantalla
          let html = `<p style="color:#38bdf8; font-weight:bold;">📍 ${numPagina} - Detectados: ${productos.length}</p>`;
          productos.forEach((p, idx) => {
            html += `
              <div class="producto-item">
                <div style="display: flex; justify-content: space-between; align-items: start;">
                  <span class="prod-title">${idx + 1}. ${p.nombre || 'Sin Nombre'}</span>
                  <span class="prod-price">$${p.precio || '0.00'}</span>
                </div>
                <div style="margin: 4px 0;">
                  <span class="prod-code">Código: ${p.codigo || 'N/A'}</span>
                </div>
                <p class="prod-detail"><strong>Ficha:</strong> ${p.ficha_tecnica || 'Sin detalles'}</p>
                <div class="prod-box">Box: [${p.box_2d ? p.box_2d.join(', ') : '0,0,0,0'}]</div>
              </div>
            `;
          });
          document.getElementById('fichasContainer').innerHTML = html;

          // 5. Confirmación de almacenamiento
          logStatus(`[${i}/${totalPages}] ✅ ${numPagina} completada. Imagen almacenada (${imgbbUrl ? 'ImgBB OK' : 'Local OK'}). Guardando productos...`);
          await new Promise(r => setTimeout(r, 1500));
        }

        logStatus(`🎉 ¡Proceso completado con éxito! Se procesaron las ${totalPages} páginas del catálogo.`);

      } catch (err) {
        logStatus(`❌ Error en el procesamiento: ${err.message}`);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
